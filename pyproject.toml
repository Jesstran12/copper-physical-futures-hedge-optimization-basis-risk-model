[project]
name = "copper-hedge-analysis"
version = "0.1.0"
description = "Minimum-variance copper hedge ratio and basis-risk analysis (LME cash vs. COMEX HG futures)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "pytest>=9.1.1",
    "requests>=2.34.2",
    "statsmodels>=0.14.6",
    "yfinance>=1.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/copper_hedge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
